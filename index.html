<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation for Borsha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* রেইনবো ব্যাকগ্রাউন্ড অ্যানিমেশন */
            background: linear-gradient(124deg, #0f0c20, #150826, #000000, #1a001a);
            background-size: 400% 400%;
            animation: rainbowBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        @keyframes rainbowBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse 3s ease-in-out infinite alternate;
        }

        /* মাঝখানের গোল ছবি */
        .center-photo {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff3385;
            box-shadow: 0 0 20px #ff3385, 0 0 40px #ff007f;
            z-index: 10;
        }

        .love-text {
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            /* রেইনবো কালার ইফেক্ট টেক্সটের জন্য */
            background: linear-gradient(45deg, #ff007f, #ff0000, #ffaa00, #00ffcc, #ff00ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowText 3s linear infinite, glow 2s ease-in-out infinite alternate;
        }

        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 2px rgba(255, 0, 128, 0.6)); }
            to { filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9)); }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.05); }
        }

        /* ব্যাকগ্রাউন্ডের ছোট তারা */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="container" id="heartContainer">
        <!-- ছবির লিংক এখানে পরিবর্তন করতে পারবেন -->
        <img src="https://i.postimg.cc/m2mg284x/love.jpg" alt="Borsha" class="center-photo">
    </div>

    <script>
        const container = document.getElementById('heartContainer');
        const totalItems = 40; 
        const scale = 11; 

        // পারফেক্ট হার্ট শেপে লেখাগুলো সাজানো
        for (let i = 0; i < totalItems; i++) {
            const t = (i / totalItems) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            const posX = x * scale;
            const posY = y * scale;

            const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
            const dy = 13 * Math.sin(t) - 10 * Math.sin(2*t) - 6 * Math.sin(3*t) - 4 * Math.sin(4*t);
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);

            const div = document.createElement('div');
            div.className = 'love-text';
            div.innerText = 'I love you Borsha 💓';
            div.style.transform = `translate(${posX}px, ${posY}px) rotate(${angle}deg)`;

            container.appendChild(div);
        }

        // ব্যাকগ্রাউন্ডে ৫০টি ছোট তারা তৈরি করা
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
        }
    </script>
</body>
</html>

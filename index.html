<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #ui {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .love {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            --i: 1;
        }

        .love_horizontal {
            animation: moveHorizontal 4s ease-in-out infinite alternate;
            animation-delay: calc(var(--i) * -0.1s);
        }

        .love_vertical {
            animation: moveVertical 2s ease-in-out infinite alternate;
            animation-delay: calc(var(--i) * -0.1s);
        }

        .love_word {
            color: #ff69b4;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #ff69b4;
        }

        @keyframes moveHorizontal {
            0% { transform: translateX(-120px); }
            50% { transform: translateX(0px); }
            100% { transform: translateX(120px); }
        }

        @keyframes moveVertical {
            0% { transform: translateY(-100px) scale(0.8); }
            50% { transform: translateY(100px) scale(1.2); }
            100% { transform: translateY(-100px) scale(0.8); }
        }
    </style>
</head>
<body>

    <div id="ui"></div>

    <script>
        const ui = document.getElementById("ui");
        const totalItems = 30;

        for (let i = 1; i <= totalItems; i++) {
            const love = document.createElement("div");
            love.className = "love";
            love.style.setProperty("--i", i);

            love.innerHTML = `
                <div class="love_horizontal">
                    <div class="love_vertical">
                        <div class="love_word">I love you</div>
                    </div>
                </div>
            `;

            ui.appendChild(love);
        }
    </script>
</body>
</html>

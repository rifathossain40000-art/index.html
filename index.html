<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation for Borsha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .heart-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: heartPulse 3.5s ease-in-out infinite alternate;
        }

        .love-item {
            position: absolute;
            color: #ff3385;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 8px #ff3385, 0 0 15px #ff69b4;
            animation: slowRotate 8s linear infinite;
        }

        @keyframes heartPulse {
            0% {
                transform: scale(0.85);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(0.9);
            }
        }

        @keyframes slowRotate {
            0% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>

    <div class="heart-wrapper" id="heart"></div>

    <script>
        const container = document.getElementById('heart');
        const totalItems = 36; // সুন্দর হার্ট শেপের জন্য আদর্শ সংখ্যা
        const scale = 11; // সাইজ

        for (let i = 0; i < totalItems; i++) {
            // ০ থেকে ২*পাই পর্যন্ত পয়েন্ট ভাগ করা
            const t = (i / totalItems) * Math.PI * 2;
            
            // পারফেক্ট হার্ট ফর্মুলা
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            const posX = x * scale;
            const posY = y * scale;

            // টেক্সটের দিক (অ্যাঙ্গেল) ঠিক রাখার হিসাব
            const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
            const dy = 13 * Math.sin(t) - 10 * Math.sin(2*t) - 6 * Math.sin(3*t) - 4 * Math.sin(4*t);
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);

            const div = document.createElement('div');
            div.className = 'love-item';
            div.innerText = 'I love you Borsha 💓';
            
            // শেপ সেট করা
            div.style.transform = `translate(${posX}px, ${posY}px) rotate(${angle}deg)`;

            container.appendChild(div);
        }
    </script>
</body>
</html>

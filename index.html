<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Borsha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffe6f0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px 0;
            font-family: Arial, sans-serif;
        }

        .row {
            display: flex;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .row-content {
            display: flex;
            gap: 20px;
            animation-duration: 18s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* বাম থেকে ডান */
        .left-to-right {
            animation-name: moveRight;
        }

        /* ডান থেকে বাম */
        .right-to-left {
            animation-name: moveLeft;
        }

        .card {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            color: #4a0e4e;
            font-size: 13px;
            font-weight: bold;
        }

        .card img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #8e24aa;
        }

        @keyframes moveRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }

        @keyframes moveLeft {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <script>
        const images = [
            '[![3b20a594a2b327f35a5c98a62a648600-0-2.jpg](https://i.postimg.cc/xT08Jw2Q/3b20a594a2b327f35a5c98a62a648600-0-2.jpg)](https://postimg.cc/CdQS965r)',
            'https://postimg.cc/2bdThttP'
        ];

        const totalRows = 9; // স্ক্রিনে কতগুলো লাইন থাকবে

        for (let r = 0; r < totalRows; r++) {
            const row = document.createElement('div');
            row.className = 'row';

            const content = document.createElement('div');
            // অল্টারনেট করে বাম-ডান অ্যানিমেশন সেট
            const directionClass = (r % 2 === 0) ? 'left-to-right' : 'right-to-left';
            content.className = `row-content ${directionClass}`;

            // নিরবচ্ছিন্ন চলাচলের জন্য ডাবল কার্ড তৈরি
            let cardsHTML = '';
            for (let i = 0; i < 10; i++) {
                const imgUrl = images[i % images.length];
                cardsHTML += `
                    <div class="card">
                        <img src="${imgUrl}" alt="Borsha">
                        <span>I love you Borsha 💓</span>
                    </div>
                `;
            }

            content.innerHTML = cardsHTML + cardsHTML; // স্মুথ লুপের জন্য ডুপ্লিকেট
            row.appendChild(content);
            document.body.appendChild(row);
        }
    </script>
</body>
</html>

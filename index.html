<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation for Borsha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #ff3385; /* Pink Text */
            font-family: Arial, sans-serif;
            perspective: 1000px;
        }

        #ui {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: containerRotation 20s linear infinite; /* Optional entire shape rotation */
        }

        .love {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .love_word {
            /* লেখার সাইজ ছোট করা হয়েছে (১১ পিক্সেল) */
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            /* লেখার উজ্জ্বলতা কমানো হয়েছে (টেক্সট শ্যাডো কমিয়ে) */
            text-shadow: 0 0 5px rgba(255, 51, 133, 0.7);
            /* ঘূর্ণন অ্যানিমেশন যোগ করা হয়েছে */
            animation: drawTrail 8s ease-in-out infinite alternate;
        }

        /* এই অ্যানিমেশনটি প্রতিটি লেখাকে ঘোরাবে */
        @keyframes drawTrail {
            0% {
                transform: rotateY(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: rotateY(36deg) scale(1);
            }
            100% {
                transform: rotateY(360deg) scale(1.1);
                opacity: 1;
            }
        }

        /* চাইলে পুরো হার্ট শেপটিকেও ধীরে ঘোরাতে পারেন */
        @keyframes containerRotation {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>

    <div id="ui"></div>

    <script>
        const container = document.getElementById('ui');
        const totalItems = 30; // হার্ট শেপ গঠনের জন্য লেখা

        for (let i = 1; i <= totalItems; i++) {
            const love = document.createElement('div');
            love.className = 'love';
            
            // হার্ট শেপের গাণিতিক ফর্মুলা (আগের কোডের মতো)
            const t = (i / totalItems) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            const scaleFactor = 10; // হার্ট সাইজ (অ্যাডজাস্ট করুন)
            const posX = x * scaleFactor;
            const posY = y * scaleFactor;

            love.style.left = `calc(50% + ${posX}px)`;
            love.style.top = `calc(50% + ${posY}px)`;
            
            // প্রতিটি লেখার জন্য আলাদা করে বিলম্ব (delay) যোগ করা হয়েছে যাতে একটি ট্রেইল তৈরি হয়
            const animationDelay = (i / totalItems) * -8; // -8s, 0.75-এর মতো ধীরে
            love.innerHTML = `<div class="love_word" style="animation-delay: ${animationDelay}s">I love you Borsha 💓</div>`;

            container.appendChild(love);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Borsha</title>
    <style>
        :root {
            --pink-bg: #e63956;
            --ink: #ffffff;
            --bar-bg: #12040b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--pink-bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        /* Cinematic Top and Bottom Bars */
        .bar {
            position: absolute;
            left: 0;
            right: 0;
            height: 16vh;
            background: var(--bar-bg);
            z-index: 3;
            will-change: transform;
            pointer-events: none;
        }

        .bar--top {
            top: 0;
        }

        .bar--bot {
            bottom: 0;
        }

        /* Wish Subtitle Text */
        .sub-text {
            position: absolute;
            top: -30px;
            left: 5px;
            font-size: 14px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
            font-family: sans-serif;
        }

        /* Main Container */
        .wish-container {
            position: relative;
            text-align: center;
            z-index: 2;
        }

        .wish {
            position: relative;
            color: var(--ink);
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.15);
            animation: textGlow 3s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% {
                transform: scale(0.98);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.02);
                opacity: 1;
                text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            }
        }
    </style>
</head>
<body>

    <!-- Cinematic Bars -->
    <div class="bar bar--top"></div>
    <div class="bar bar--bot"></div>

    <!-- Main Interactive Wish -->
    <div class="wish-container">
        <span class="sub-text">make a wish..</span>
        <h1 class="wish">I love you Borsha</h1>
    </div>

</body>
</html>
